services:
  db:
    image: postgres:16-alpine
    container_name: toyota-servis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servisdefteri}
      POSTGRES_USER: ${POSTGRES_USER:-servisdefteri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasinda tanimlanmalidir}
      TZ: Europe/Istanbul
      PGTZ: Europe/Istanbul
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1024m
    cpus: 2.0
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: servisdefteri:1.0.0
    container_name: toyota-servis-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 18080
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-2h}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-servisdefteri}
      DB_USERNAME: ${POSTGRES_USER:-servisdefteri}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-servisdefteri}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      BACKUP_ENABLED: "true"
      BACKUP_DIR: /app/backups
      BACKUP_HOST_DIR: ${BACKUP_HOST_DIR:-./yedekler}
      BACKUP_COPY_DIR: ${BACKUP_COPY_DIR:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_CRON: ${BACKUP_CRON:-0 0 2 * * *}
      APP_UPDATE_ENABLED: "false"
      APP_BUILD_COMMIT: "dist"
      THYMELEAF_CACHE: "true"
      TZ: Europe/Istanbul
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:18080"
    volumes:
      - "${BACKUP_HOST_DIR:-./yedekler}:/app/backups"
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:18080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
    name: toyota-servis-pgdata

networks:
  internal:
    name: toyota-servis-internal
    driver: bridge
