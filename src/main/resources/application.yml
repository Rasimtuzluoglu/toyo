spring:
  application:
    name: servisdefteri
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/servisdefteri}
    username: ${DB_USERNAME:servisdefteri}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Istanbul
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  web:
    locale: tr_TR
    locale-resolver: fixed
  mvc:
    format:
      date: dd.MM.yyyy
      date-time: dd.MM.yyyy HH:mm
      time: HH:mm
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:2h}
      cookie:
        http-only: true
        same-site: lax

server:
  port: ${SERVER_PORT:18080}
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      tracking-modes: cookie
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

logging:
  level:
    root: INFO
    tr.com.servisdefteri: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

app:
  timezone: Europe/Istanbul
  initial-admin:
    username: ${INITIAL_ADMIN_USERNAME:}
    password: ${INITIAL_ADMIN_PASSWORD:}
    full-name: ${INITIAL_ADMIN_FULL_NAME:İşletme Sahibi}
  backup:
    enabled: ${BACKUP_ENABLED:true}
    directory: ${BACKUP_DIR:./backups}
    retention-days: ${BACKUP_RETENTION_DAYS:14}
    cron: ${BACKUP_CRON:0 0 2 * * *}
    pg-dump-path: ${PG_DUMP_PATH:pg_dump}
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:servisdefteri}
    username: ${DB_USERNAME:servisdefteri}
    password: ${DB_PASSWORD:}
