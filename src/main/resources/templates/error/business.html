<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('İşlem Tamamlanamadı')}"></head>
<body>
<div class="error-page">
    <div class="error-card">
        <span class="error-icon"><i class="bi bi-exclamation-triangle" aria-hidden="true"></i></span>
        <div class="error-code">İşlem reddedildi</div>
        <h1 th:text="${errorTitle == null ? 'İşlem tamamlanamadı' : errorTitle}">İşlem tamamlanamadı</h1>
        <p class="text-muted-soft" th:text="${errorMessage}">Kural ihlali nedeniyle işlem yapılamadı.</p>
        <div class="d-flex justify-content-center gap-2 mt-4">
            <a class="btn btn-outline-secondary" href="javascript:history.back()">Geri Dön</a>
            <a class="btn btn-primary" th:href="@{/}" sec:authorize="isAuthenticated()">Ana Panel</a>
            <a class="btn btn-primary" th:href="@{/login}" sec:authorize="!isAuthenticated()">Giriş</a>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
