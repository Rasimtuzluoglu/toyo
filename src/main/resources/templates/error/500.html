<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Beklenmeyen Hata')}"></head>
<body>
<div class="error-page">
    <div class="error-card">
        <span class="error-icon"><i class="bi bi-bug" aria-hidden="true"></i></span>
        <div class="error-code">HTTP 500</div>
        <h1>Beklenmeyen bir hata oluştu</h1>
        <p class="text-muted-soft">
            İşlem tamamlanamadı. Teknik ayrıntılar kullanıcıya gösterilmez; lütfen işletme sahibine başvurun.
            Hata sunucu günlüklerine kaydedildi.
        </p>
        <div class="d-flex justify-content-center gap-2 mt-4">
            <a class="btn btn-primary" th:href="@{/}" sec:authorize="isAuthenticated()">Ana Panel</a>
            <a class="btn btn-primary" th:href="@{/login}" sec:authorize="!isAuthenticated()">Giriş</a>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
