<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Erişim Engellendi')}"></head>
<body>
<div class="error-page">
    <div class="error-card">
        <span class="error-icon"><i class="bi bi-shield-lock" aria-hidden="true"></i></span>
        <div class="error-code">HTTP 403</div>
        <h1>Bu sayfaya erişim yetkiniz yok</h1>
        <p class="text-muted-soft">
            Bu işlem rolünüzün yetkileri dışında. Yetkiniz olduğunu düşünüyorsanız işletme sahibine başvurun.
        </p>
        <div class="d-flex justify-content-center gap-2 mt-4">
            <a class="btn btn-primary" th:href="@{/}" sec:authorize="isAuthenticated()">Ana Panel</a>
            <a class="btn btn-primary" th:href="@{/login}" sec:authorize="!isAuthenticated()">Giriş</a>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
