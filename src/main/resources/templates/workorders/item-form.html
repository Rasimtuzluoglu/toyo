<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Kalem Düzenle')}"></head>
<body>
<div class="sd-shell">
    <aside th:replace="~{fragments/layout :: sidebar('workorders')}"></aside>
    <div class="sd-main">
        <header th:replace="~{fragments/layout :: topbar}"></header>
        <main class="sd-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="page-head">
                <div>
                    <div class="page-eyebrow" th:text="${order.orderNo}">IS-0000</div>
                    <h1 class="page-title">Kalem Düzenle</h1>
                    <p class="page-subtitle">Tutar, miktar ve birim fiyattan sunucu tarafında yeniden hesaplanır.</p>
                </div>
                <div class="page-actions">
                    <a class="btn btn-outline-secondary" th:href="@{/work-orders/{id}(id=${order.id})}">
                        <i class="bi bi-arrow-left me-1"></i> İş Emrine Dön
                    </a>
                </div>
            </div>

            <form th:action="@{/work-orders/{id}/items/{itemId}(id=${order.id},itemId=${item.id})}"
                  method="post" th:object="${itemForm}" data-submit-once>
                <div class="sd-card">
                    <div class="sd-card-header">
                        <h2>Kalem bilgileri</h2>
                    </div>
                    <div class="sd-card-body">
                        <div th:replace="~{fragments/layout :: globalErrors}"></div>
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label class="form-label" for="type">Tip <span class="required">*</span></label>
                                <select class="form-select" id="type" th:field="*{type}"
                                        th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'">
                                    <option th:each="t : ${itemTypes}" th:value="${t.name()}"
                                            th:text="${t.label}"></option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{type}"></div>
                            </div>
                            <div class="col-md-9">
                                <label class="form-label" for="description">Açıklama <span class="required">*</span></label>
                                <input class="form-control" id="description" type="text" th:field="*{description}"
                                       th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                                       maxlength="300" required>
                                <div class="invalid-feedback" th:errors="*{description}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="quantity">Miktar <span class="required">*</span></label>
                                <input class="form-control" id="quantity" type="number" step="0.01" min="0.01"
                                       th:field="*{quantity}"
                                       th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:errors="*{quantity}"></div>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label" for="unitPrice">Birim fiyat <span class="required">*</span></label>
                                <div class="input-group">
                                    <input class="form-control" id="unitPrice" type="number" step="0.01" min="0"
                                           th:field="*{unitPrice}"
                                           th:classappend="${#fields.hasErrors('unitPrice')} ? 'is-invalid'" required>
                                    <span class="input-group-text">₺</span>
                                </div>
                                <div class="invalid-feedback d-block" th:errors="*{unitPrice}"></div>
                            </div>
                            <div class="col-md-6 d-flex align-items-end">
                                <div class="toast-inline w-100">
                                    Mevcut kalem tutarı: <strong class="money" th:text="${fmt.money(item.lineTotal)}">0,00 ₺</strong>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="sd-card-footer d-flex justify-content-end gap-2">
                        <a class="btn btn-outline-secondary" th:href="@{/work-orders/{id}(id=${order.id})}">Vazgeç</a>
                        <button class="btn btn-primary" type="submit">
                            <span class="spinner-border spinner-border-sm me-2 d-none" aria-hidden="true"></span>
                            <i class="bi bi-check2 me-1"></i> Kaydet
                        </button>
                    </div>
                </div>
            </form>
        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
