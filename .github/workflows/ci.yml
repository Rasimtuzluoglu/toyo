name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Testler
        run: mvn -B clean verify

      - name: Docker imajı
        run: docker build -t servisdefteri:ci .

      - name: Docker imajını tara
        uses: docker/scout-action@v1
        continue-on-error: true
        with:
          command: cves
          image: servisdefteri:ci
          only-severities: critical,high
          exit-code: false
